<svg width="100%" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Production architecture — candidate–job matching system</title>
<desc>Three-zone architecture: offline batch pipeline, online serving, feedback and monitoring.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 13px; font-weight: 600; }
    .ts  { font-size: 11px; font-weight: 400; fill: #555; }
    .arr { stroke: #888; stroke-width: 1.5; fill: none; }

    .zone-teal-bg   { fill: #e1f5ee; stroke: #0f6e56; }
    .zone-purple-bg { fill: #eeedfe; stroke: #534ab7; }
    .zone-coral-bg  { fill: #faece7; stroke: #993c1d; }
    .zone-header-teal   { fill: #0f6e56; }
    .zone-header-purple { fill: #534ab7; }
    .zone-header-coral  { fill: #993c1d; }
    .zone-header-text   { fill: #fff; font-size: 12px; font-weight: 600; font-family: system-ui, sans-serif; }

    .box-gray   { fill: #f1efe8; stroke: #888780; stroke-width: 0.5; }
    .box-amber  { fill: #faeeda; stroke: #ba7517; stroke-width: 0.5; }
    .box-blue   { fill: #e6f1fb; stroke: #185fa5; stroke-width: 0.5; }
    .box-teal   { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 0.5; }
    .box-purple { fill: #eeedfe; stroke: #534ab7; stroke-width: 0.5; }
    .box-coral  { fill: #faece7; stroke: #993c1d; stroke-width: 0.5; }

    .th-teal   { fill: #085041; }
    .th-purple { fill: #3c3489; }
    .th-amber  { fill: #633806; }
    .th-blue   { fill: #0c447c; }
    .th-coral  { fill: #712b13; }
    .th-gray   { fill: #444441; }
    .ts-teal   { fill: #0f6e56; }
    .ts-purple { fill: #534ab7; }
    .ts-amber  { fill: #854f0b; }
    .ts-blue   { fill: #185fa5; }
    .ts-coral  { fill: #993c1d; }
    .ts-gray   { fill: #5f5e5a; }
  </style>
</defs>

<!-- ══ ZONE 1: OFFLINE ══ -->
<rect x="32" y="44" width="616" height="198" rx="4" class="zone-teal-bg" stroke-width="0.5" fill-opacity="0.2"/>
<rect x="32" y="20" width="616" height="24" rx="4" class="zone-header-teal"/>
<text class="zone-header-text" x="340" y="36" text-anchor="middle" dominant-baseline="central">Offline pipeline — nightly batch</text>

<!-- Candidates -->
<rect x="52" y="64" width="120" height="52" rx="4" class="box-gray"/>
<text class="th th-gray" x="112" y="84" text-anchor="middle" dominant-baseline="central">Candidates</text>
<text class="ts ts-gray" x="112" y="102" text-anchor="middle" dominant-baseline="central">CV · skills · exp</text>

<!-- ESCO tag -->
<rect x="52" y="154" width="120" height="18" rx="3" class="box-amber"/>
<text class="ts ts-amber" x="112" y="163" text-anchor="middle" dominant-baseline="central">+ ESCO enrichment</text>

<!-- Jobs -->
<rect x="52" y="164" width="120" height="52" rx="4" class="box-gray"/>
<text class="th th-gray" x="112" y="184" text-anchor="middle" dominant-baseline="central">Jobs</text>
<text class="ts ts-gray" x="112" y="202" text-anchor="middle" dominant-baseline="central">title · skills · desc</text>

<!-- Arrows to encoder -->
<line x1="172" y1="90" x2="218" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="172" y1="190" x2="218" y2="158" class="arr" marker-end="url(#arrow)"/>

<!-- JobBERT -->
<rect x="218" y="108" width="148" height="60" rx="4" class="box-amber"/>
<text class="th th-amber" x="292" y="130" text-anchor="middle" dominant-baseline="central">JobBERT-v3</text>
<text class="ts ts-amber" x="292" y="150" text-anchor="middle" dominant-baseline="central">GPU · batch_size=512</text>
<rect x="230" y="176" width="124" height="22" rx="3" class="box-gray"/>
<text class="ts ts-gray" x="292" y="187" text-anchor="middle" dominant-baseline="central">Airflow · Docker</text>

<!-- Arrows to stores -->
<line x1="366" y1="124" x2="412" y2="96" class="arr" marker-end="url(#arrow)"/>
<line x1="366" y1="148" x2="412" y2="180" class="arr" marker-end="url(#arrow)"/>

<!-- Vector store -->
<rect x="412" y="64" width="216" height="56" rx="4" class="box-blue"/>
<text class="th th-blue" x="520" y="84" text-anchor="middle" dominant-baseline="central">Vector store</text>
<text class="ts ts-blue" x="520" y="102" text-anchor="middle" dominant-baseline="central">pgvector (PostgreSQL) · 768-dim</text>

<!-- Feature store -->
<rect x="412" y="160" width="216" height="56" rx="4" class="box-blue"/>
<text class="th th-blue" x="520" y="180" text-anchor="middle" dominant-baseline="central">Feature store</text>
<text class="ts ts-blue" x="520" y="198" text-anchor="middle" dominant-baseline="central">PostgreSQL · exp · skills · edu</text>

<!-- Connector offline → online -->
<line x1="340" y1="242" x2="340" y2="278" class="arr" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
<text class="ts" x="356" y="264" dominant-baseline="central" fill="#aaa">query time</text>

<!-- ══ ZONE 2: ONLINE ══ -->
<rect x="32" y="302" width="616" height="168" rx="4" class="zone-purple-bg" stroke-width="0.5" fill-opacity="0.15"/>
<rect x="32" y="278" width="616" height="24" rx="4" class="zone-header-purple"/>
<text class="zone-header-text" x="340" y="294" text-anchor="middle" dominant-baseline="central">Online serving — FastAPI · Docker · &lt;200ms</text>

<!-- Query -->
<rect x="52" y="322" width="96" height="48" rx="4" class="box-gray"/>
<text class="th th-gray" x="100" y="342" text-anchor="middle" dominant-baseline="central">Query</text>
<text class="ts ts-gray" x="100" y="358" text-anchor="middle" dominant-baseline="central">job or candidate</text>
<line x1="148" y1="346" x2="180" y2="346" class="arr" marker-end="url(#arrow)"/>

<!-- Stage 1 -->
<rect x="180" y="314" width="172" height="104" rx="4" class="box-teal"/>
<text class="th th-teal" x="266" y="336" text-anchor="middle" dominant-baseline="central">Stage 1 · Recall</text>
<text class="ts ts-teal" x="266" y="356" text-anchor="middle" dominant-baseline="central">ANN search · FAISS</text>
<text class="ts ts-teal" x="266" y="374" text-anchor="middle" dominant-baseline="central">top K=50 returned</text>
<text class="ts" x="266" y="394" text-anchor="middle" dominant-baseline="central" fill="#aaa">10–50ms</text>
<line x1="352" y1="366" x2="384" y2="366" class="arr" marker-end="url(#arrow)"/>

<!-- Stage 2 -->
<rect x="384" y="314" width="244" height="104" rx="4" class="box-purple"/>
<text class="th th-purple" x="506" y="336" text-anchor="middle" dominant-baseline="central">Stage 2 · Rerank</text>
<text class="ts ts-purple" x="506" y="356" text-anchor="middle" dominant-baseline="central">Ridge / HGB · structured features</text>
<text class="ts ts-purple" x="506" y="374" text-anchor="middle" dominant-baseline="central">exp · skills · edu · title_sim</text>
<text class="ts" x="506" y="394" text-anchor="middle" dominant-baseline="central" fill="#aaa">20–50ms · returns top 10</text>

<!-- Dashed feeds from stores -->
<path d="M520 160 L520 302 L506 314" fill="none" stroke="#185fa5" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M460 120 L460 290 L266 290 L266 314" fill="none" stroke="#185fa5" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Azure tag -->
<rect x="440" y="432" width="200" height="22" rx="4" class="box-blue"/>
<text class="ts ts-blue" x="540" y="443" text-anchor="middle" dominant-baseline="central">Azure Container Apps (cloud)</text>

<!-- Cold start -->
<rect x="52" y="432" width="376" height="22" rx="4" class="box-gray"/>
<text class="ts ts-gray" x="240" y="443" text-anchor="middle" dominant-baseline="central">cold start → structured features only + low-confidence flag</text>

<!-- Connector online → feedback -->
<line x1="340" y1="470" x2="340" y2="506" class="arr" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
<text class="ts" x="356" y="492" dominant-baseline="central" fill="#aaa">weekly</text>

<!-- ══ ZONE 3: FEEDBACK + MONITORING ══ -->
<rect x="32" y="530" width="616" height="256" rx="4" class="zone-coral-bg" stroke-width="0.5" fill-opacity="0.12"/>
<rect x="32" y="506" width="616" height="24" rx="4" class="zone-header-coral"/>
<text class="zone-header-text" x="340" y="522" text-anchor="middle" dominant-baseline="central">Feedback loop + monitoring</text>

<!-- Recruiter signals -->
<rect x="52" y="550" width="160" height="96" rx="4" class="box-coral"/>
<text class="th th-coral" x="132" y="572" text-anchor="middle" dominant-baseline="central">Recruiter signals</text>
<text class="ts ts-coral" x="132" y="592" text-anchor="middle" dominant-baseline="central">shortlist → positive</text>
<text class="ts ts-coral" x="132" y="610" text-anchor="middle" dominant-baseline="central">interview → strong +</text>
<text class="ts ts-coral" x="132" y="628" text-anchor="middle" dominant-baseline="central">reject → negative</text>
<line x1="212" y1="598" x2="248" y2="598" class="arr" marker-end="url(#arrow)"/>

<!-- Fine-tuning -->
<rect x="248" y="550" width="172" height="96" rx="4" class="box-amber"/>
<text class="th th-amber" x="334" y="572" text-anchor="middle" dominant-baseline="central">Fine-tuning</text>
<text class="ts ts-amber" x="334" y="592" text-anchor="middle" dominant-baseline="central">MultipleNegatives</text>
<text class="ts ts-amber" x="334" y="610" text-anchor="middle" dominant-baseline="central">RankingLoss · GPU</text>
<text class="ts ts-amber" x="334" y="628" text-anchor="middle" dominant-baseline="central">Azure ML compute</text>
<line x1="420" y1="598" x2="456" y2="598" class="arr" marker-end="url(#arrow)"/>

<!-- Updated model -->
<rect x="456" y="550" width="172" height="96" rx="4" class="box-teal"/>
<text class="th th-teal" x="542" y="572" text-anchor="middle" dominant-baseline="central">Updated model</text>
<text class="ts ts-teal" x="542" y="592" text-anchor="middle" dominant-baseline="central">predicts recruiter intent</text>
<text class="ts ts-teal" x="542" y="610" text-anchor="middle" dominant-baseline="central">not rule-based label</text>
<text class="ts" x="542" y="628" text-anchor="middle" dominant-baseline="central" fill="#aaa">→ replaces serving model</text>

<!-- Feedback arc -->
<path d="M628 598 L648 598 L648 366 L628 366" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)" opacity="0.4"/>

<!-- Monitoring boxes -->
<rect x="52" y="666" width="200" height="100" rx="4" class="box-gray"/>
<text class="th th-gray" x="152" y="686" text-anchor="middle" dominant-baseline="central">Monitoring dashboard</text>
<text class="ts ts-gray" x="152" y="704" text-anchor="middle" dominant-baseline="central">Dash (Plotly) · Python</text>
<text class="ts ts-gray" x="152" y="720" text-anchor="middle" dominant-baseline="central">NDCG@5 · feature drift</text>
<text class="ts ts-gray" x="152" y="736" text-anchor="middle" dominant-baseline="central">bias checks · weekly</text>

<rect x="268" y="666" width="200" height="100" rx="4" class="box-gray"/>
<text class="th th-gray" x="368" y="686" text-anchor="middle" dominant-baseline="central">Infra monitoring</text>
<text class="ts ts-gray" x="368" y="704" text-anchor="middle" dominant-baseline="central">Prometheus + Grafana</text>
<text class="ts ts-gray" x="368" y="720" text-anchor="middle" dominant-baseline="central">API latency · error rate</text>
<text class="ts ts-gray" x="368" y="736" text-anchor="middle" dominant-baseline="central">container health</text>

<rect x="484" y="666" width="148" height="100" rx="4" class="box-gray"/>
<text class="th th-gray" x="558" y="686" text-anchor="middle" dominant-baseline="central">Experiment tracking</text>
<text class="ts ts-gray" x="558" y="704" text-anchor="middle" dominant-baseline="central">MLflow</text>
<text class="ts ts-gray" x="558" y="720" text-anchor="middle" dominant-baseline="central">training runs</text>
<text class="ts ts-gray" x="558" y="736" text-anchor="middle" dominant-baseline="central">model versions</text>

</svg>
